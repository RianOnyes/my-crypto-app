<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Factor Crypto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Dual<span class="highlight">Shield</span></h1>
            <p>Enkripsi Kombinasi: RSA (File Key) + AES (Password Manual)</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('gen')">1. Buat Kunci RSA</button>
            <button class="tab-btn" onclick="openTab('enc')">2. Enkripsi (Double)</button>
            <button class="tab-btn" onclick="openTab('dec')">3. Dekripsi (Double)</button>
            <button class="tab-btn" onclick="openTab('hist'); loadHistory()">4. Riwayat</button>
        </div>

        <div id="gen" class="tab-content active">
            <div class="card">
                <p style="margin-bottom: 20px;">Klik tombol di bawah untuk membuat pasangan kunci RSA (Public & Private).</p>
                <button onclick="generateKeys()" class="action-btn">Generate Key Pair</button>
                
                <div class="output-group">
                    <label>Public Key (Untuk Enkripsi):</label>
                    <textarea id="gen_pub" readonly></textarea>
                </div>
                <div class="output-group">
                    <label>Private Key (Untuk Dekripsi - SIMPAN INI):</label>
                    <textarea id="gen_priv" class="secret" readonly></textarea>
                </div>
            </div>
        </div>

        <div id="enc" class="tab-content">
            <div class="card">
                <form action="/api/encrypt_dual" method="POST" enctype="multipart/form-data">
                    <label>1. Upload File:</label>
                    <input type="file" name="file" required>
                    
                    <div class="step-container" style="margin-top: 15px; border-left: 3px solid #38bdf8; padding-left: 15px;">
                        <label style="color: #38bdf8;">METODE 1: Public Key</label>
                        <textarea name="public_key" placeholder="Paste Public Key penerima..." required style="height: 80px;"></textarea>
                    </div>

                    <div class="step-container" style="margin-top: 15px; border-left: 3px solid #f472b6; padding-left: 15px;">
                        <label style="color: #f472b6;">METODE 2: Buat Sandi Manual</label>
                        <input type="text" name="password" placeholder="Contoh: KucingTerbang2025" required style="font-weight: bold;">
                        <p class="hint" style="text-align: left;">*Penerima WAJIB tahu sandi ini untuk membuka file.</p>
                    </div>
                    
                    <button type="submit" class="action-btn">🔒 Enkripsi & Download</button>
                </form>
            </div>
        </div>

        <div id="dec" class="tab-content">
            <div class="card">
                <form action="/api/decrypt_dual" method="POST" enctype="multipart/form-data">
                    <label>Upload File Terkunci (.secure):</label>
                    <input type="file" name="file" required>
                    
                    <div class="step-container" style="margin-top: 15px; border-left: 3px solid #38bdf8; padding-left: 15px;">
                        <label style="color: #38bdf8;">SYARAT 1: Private Key</label>
                        <textarea name="private_key" placeholder="Paste Private Key Anda..." required style="height: 80px;"></textarea>
                    </div>

                    <div class="step-container" style="margin-top: 15px; border-left: 3px solid #f472b6; padding-left: 15px;">
                        <label style="color: #f472b6;">SYARAT 2: Masukkan Sandi Manual</label>
                        <input type="password" name="password" placeholder="Masukkan sandi dari pengirim..." required>
                    </div>
                    
                    <button type="submit" class="action-btn secondary">🔓 Validasi Ganda & Buka File</button>
                </form>
            </div>
        </div>

        <div id="hist" class="tab-content">
            <div class="card">
                <h3>📜 Log Aktivitas</h3>
                <table class="history-table">
                    <thead><tr><th>Waktu</th><th>Aksi</th><th>File</th></tr></thead>
                    <tbody id="history-list"></tbody>
                </table>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button onclick="loadHistory()" class="action-btn" style="background: #475569; flex: 1;">🔄 Refresh</button>
                    <button onclick="clearHistory()" class="action-btn" style="background: #ef4444; flex: 1;">🗑️ Hapus</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function generateKeys() {
            const btn = document.querySelector('button[onclick="generateKeys()"]');
            btn.innerText = "Memproses...";
            const response = await fetch('/api/generate_keys', { method: 'POST' });
            const data = await response.json();
            document.getElementById('gen_priv').value = data.private_key;
            document.getElementById('gen_pub').value = data.public_key;
            btn.innerText = "Generate Key Pair";
            alert("Kunci Siap! Sekarang Anda bisa Enkripsi.");
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            try {
                const res = await fetch('/api/get_history');
                const data = await res.json();
                list.innerHTML = '';
                if(data.length === 0) list.innerHTML = '<tr><td colspan="3" align="center">Kosong</td></tr>';
                data.forEach(item => {
                    list.innerHTML += `<tr><td style="color:#94a3b8; font-size:0.8rem;">${item.timestamp}</td><td>${item.action}</td><td style="color:#fff;">${item.filename}</td></tr>`;
                });
            } catch(e) {}
        }
        async function clearHistory() {
            if(confirm("Hapus?")) { await fetch('/api/clear_history', { method: 'POST' }); loadHistory(); }
        }
    </script>
</body>
</html>
