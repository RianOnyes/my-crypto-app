<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Locker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 PDF<span class="highlight">Locker</span></h1>
            <p>Kunci Dokumen PDF agar aman saat dikirim via Email.</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('protect')">1. Kunci PDF</button>
            <button class="tab-btn" onclick="openTab('hist'); loadHistory()">2. Riwayat</button>
        </div>

        <div id="protect" class="tab-content active">
            <div class="card">
                <form action="/api/encrypt_pdf" method="POST" enctype="multipart/form-data">
                    <label>1. Upload File PDF:</label>
                    <input type="file" name="file" accept=".pdf" required>
                    
                    <label>2. Buat Password Pengaman:</label>
                    <input type="text" name="password" placeholder="Password untuk membuka file nanti..." required>
                    
                    <button type="submit" class="action-btn">🔒 Kunci & Download PDF</button>
                </form>
                <p class="hint">
                    *File hasil download bisa dibuka langsung di HP/Laptop penerima.<br>
                    Mereka akan diminta password yang Anda buat di atas.
                </p>
            </div>
        </div>

        <div id="hist" class="tab-content">
            <div class="card">
                <h3>📜 Riwayat Proses</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Status</th>
                            <th>Nama File</th>
                        </tr>
                    </thead>
                    <tbody id="history-list"></tbody>
                </table>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button onclick="loadHistory()" class="action-btn" style="background: #475569; flex: 1;">🔄 Refresh</button>
                    <button onclick="clearHistory()" class="action-btn" style="background: #ef4444; flex: 1;">🗑️ Hapus</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '<tr><td colspan="3" style="text-align:center;">Memuat...</td></tr>';
            try {
                const response = await fetch('/api/get_history');
                const data = await response.json();
                list.innerHTML = '';
                if(data.length === 0) list.innerHTML = '<tr><td colspan="3" style="text-align:center;">Kosong.</td></tr>';
                
                data.forEach(item => {
                    let row = `<tr>
                        <td style="color:#94a3b8; font-size:0.85rem;">${item.timestamp}</td>
                        <td><span class="badge-enc">SUKSES</span></td>
                        <td style="color:#f1f5f9; font-weight:bold;">${item.filename}</td>
                    </tr>`;
                    list.innerHTML += row;
                });
            } catch (e) { list.innerHTML = '<tr><td colspan="3">Gagal mengambil data.</td></tr>'; }
        }

        async function clearHistory() {
            if(confirm("Hapus semua riwayat?")) {
                await fetch('/api/clear_history', { method: 'POST' });
                loadHistory();
            }
        }
    </script>
</body>
</html>
